<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rani AI (रानी) - Control Dashboard</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    h1 { color: #38bdf8; text-align: center; font-size: 24px; }
    .status { text-align: center; color: #4ade80; font-size: 14px; margin-bottom: 20px; }
    textarea {
      width: 100%;
      height: 100px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    #response {
      margin-top: 20px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      min-height: 80px;
      white-space: pre-wrap;
      font-size: 14px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👑 रानी (Rani AI)</h1>
    <div class="status">● System Active 24/7 (Render Cloud)</div>
    
    <label for="prompt">Aadesh Yahan Likhein:</label>
    <textarea id="prompt" placeholder="Ae Rani, aaj ka task batao..."></textarea>
    <button onclick="sendTask()">Task Bhejo</button>

    <h3>Response:</h3>
    <div id="response">Aapke aadesh ka intezar hai...</div>
  </div>

  <script>
    async function sendTask() {
      const promptText = document.getElementById('prompt').value;
      const responseDiv = document.getElementById('response');
      if (!promptText) return alert("Kripya koi task likhein!");

      responseDiv.innerText = "Rani AI soch rahi hai...";

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await res.json();
        responseDiv.innerText = data.reply || data.error || "Koi jawab nahi mila.";
      } catch (err) {
        responseDiv.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
  </html>
