<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rani AI (रानी) - Always Listening</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    .status { color: #4ade80; font-size: 14px; margin-bottom: 20px; }
    .mic-indicator {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #0284c7;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
    }
    .listening {
      background: #e11d48;
      box-shadow: 0 0 25px rgba(225, 29, 72, 0.8);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    #status-text { color: #38bdf8; font-weight: bold; margin-top: 15px; }
    #response-box {
      margin-top: 15px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      min-height: 60px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👑 रानी (Rani AI)</h1>
    <div class="status">● Automatic Wake-Word ("ए रानी")</div>

    <div id="micIcon" class="mic-indicator">🎙️</div>
    <div id="status-text">"ए रानी" बोलकर बात शुरू करें...</div>
    <div id="response-box">रानी आपकी आवाज़ सुनने के लिए तैयार है...</div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isSpeaking = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        document.getElementById('micIcon').classList.add('listening');
      };

      recognition.onend = () => {
        if (!isSpeaking) {
          recognition.start(); // Always listening loop
        }
      };

      recognition.onresult = async (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim();
        document.getElementById('status-text').innerText = `Suna: "${text}"`;

        // Check wake word or active command
        if (text.toLowerCase().includes("रानी") || text.toLowerCase().includes("rani") || text.toLowerCase().includes("ए रानी")) {
          sendToRani(text);
        }
      };

      // Auto start on page load
      window.onload = () => { recognition.start(); };
    }

    async function sendToRani(promptText) {
      isSpeaking = true;
      recognition.stop();
      
      const responseBox = document.getElementById('response-box');
      responseBox.innerText = "रानी सोच रही है...";

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await res.json();
        const reply = data.reply || "उत्तर नहीं मिल पाया।";
        
        responseBox.innerText = reply;
        speak(reply);
      } catch (err) {
        responseBox.innerText = "Error: " + err.message;
        isSpeaking = false;
        recognition.start();
      }
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.pitch = 1.1;
      utterance.rate = 0.95;

      utterance.onend = () => {
        isSpeaking = false;
        document.getElementById('status-text').innerText = '"ए रानी" बोलकर बात शुरू करें...';
        recognition.start(); // Answer dene ke baad fir se mic listening active
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
