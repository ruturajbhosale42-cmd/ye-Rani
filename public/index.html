<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rani AI (रानी) - Voice Assistant</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    .status { color: #4ade80; font-size: 14px; margin-bottom: 20px; }
    
    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      color: white;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: all 0.3s ease;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    #speech-status {
      font-size: 15px;
      color: #38bdf8;
      font-weight: bold;
      margin-top: 15px;
      min-height: 24px;
    }
    #response-text {
      margin-top: 15px;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      color: #e2e8f0;
      min-height: 50px;
      border: 1px solid #334155;
      text-align: left;
    }
    .install-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(16,185,129,0.4);
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👑 रानी (Rani AI)</h1>
    <div class="status">● 24/7 Cloud Voice Mode</div>

    <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎙️</button>
    <div id="speech-status">माइक दबाकर बात शुरू करें...</div>

    <div id="response-text">रानी आपसे बात करने के लिए तैयार है...</div>

    <button id="installBtn" class="install-btn">📲 Rani AI ऐप इंस्टॉल करें</button>
  </div>

  <script>
    // PWA Install Prompt Handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installBtn');
      if(btn) btn.style.display = 'block';
    });

    document.getElementById('installBtn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
    }

    // Speech Recognition & Synthesis
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('speech-status').innerText = "सुन रही हूँ... बोलिए!";
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('speech-status').innerText = `आपने कहा: "${transcript}"`;
        sendToRani(transcript);
      };
    } else {
      alert("आपका ब्राउज़र वॉइस रिकॉग्निशन सपोर्ट नहीं करता। Chrome ब्राउज़र इस्तेमाल करें।");
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel();
        recognition.start();
      }
    }

    async function sendToRani(userPrompt) {
      const responseDiv = document.getElementById('response-text');
      responseDiv.innerText = "रानी सोच रही है...";

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: userPrompt })
        });
        
        const data = await res.json();
        const reply = data.reply || "माफ़ कीजिए, उत्तर नहीं मिल पाया।";
        
        responseDiv.innerText = reply;
        speakText(reply);
      } catch (err) {
        responseDiv.innerText = "Error: " + err.message;
        document.getElementById('speech-status').innerText = "फिर से कोशिश करें";
      }
    }

    function speakText(text) {
      document.getElementById('speech-status').innerText = "रानी बोल रही है...";
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.pitch = 1.1;
      utterance.rate = 0.95;

      utterance.onend = () => {
        document.getElementById('speech-status').innerText = "माइक दबाकर बात शुरू करें...";
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
