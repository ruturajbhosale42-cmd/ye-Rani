<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rani AI (रानी) - Voice Mode</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    .status { color: #4ade80; font-size: 14px; margin-bottom: 30px; }
    
    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      color: white;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: all 0.3s ease;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    #speech-status {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 15px;
      min-height: 24px;
    }
    #response-text {
      margin-top: 20px;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      font-size: 15px;
      color: #e2e8f0;
      min-height: 50px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👑 रानी (Rani AI)</h1>
    <div class="status">● Voice Mode Active (24/7)</div>

    <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎙️</button>
    <div id="speech-status">बोलने के लिए माइक दबाएं...</div>

    <div id="response-text">रानी आपसे बात करने के लिए तैयार है...</div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN'; // हिंदी भाषा
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('speech-status').innerText = "सुन रही हूँ... बोलिए!";
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        document.getElementById('speech-status').innerText = "प्रॉसेस हो रहा है...";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('speech-status').innerText = `आपने कहा: "${transcript}"`;
        sendToRani(transcript);
      };
    } else {
      alert("आपकी ब्राउज़र वॉइस रिकॉग्निशन सपोर्ट नहीं करती। Chrome ब्राउज़र यूज़ करें।");
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel(); // पुरानी आवाज़ रोकें
        recognition.start();
      }
    }

    async function sendToRani(userPrompt) {
      const responseDiv = document.getElementById('response-text');
      responseDiv.innerText = "रानी सोच रही है...";

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: userPrompt })
        });
        
        const data = await res.json();
        const reply = data.reply || "माफ़ कीजिए, उत्तर नहीं मिल पाया।";
        
        responseDiv.innerText = reply;
        speakText(reply); // रानी बोलकर जवाब देगी
      } catch (err) {
        responseDiv.innerText = "Error: " + err.message;
        document.getElementById('speech-status').innerText = "फिर से कोशिश करें";
      }
    }

    function speakText(text) {
      document.getElementById('speech-status').innerText = "रानी बोल रही है...";
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN'; // हिंदी फीमेल वॉइस
      utterance.pitch = 1.1; // महिला जैसी आवाज़ के लिए
      utterance.rate = 0.95;

      utterance.onend = () => {
        document.getElementById('speech-status').innerText = "बोलने के लिए माइक दबाएं...";
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
